[package]
name = "muninn-firmware"
version = "0.1.0"
edition = "2021"

[features]
default = ["hardware"]
hardware = [
    "dep:embassy-embedded-hal",
    "dep:embassy-sync",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-rp",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
]

[dependencies]
embassy-embedded-hal = { version = "0.2.0", optional = true }
embassy-sync = { version = "0.6.0", optional = true }
embassy-executor = { version = "0.6.0", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers"], optional = true }
embassy-time = { version = "0.3.2", features = ["defmt", "defmt-timestamp-uptime"], optional = true }
embassy-rp = { version = "0.2.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"], optional = true }
cortex-m = { version = "0.7.7", features = ["inline-asm"], optional = true }
cortex-m-rt = { version = "0.7.3", optional = true }
defmt = { version = "0.3", optional = true }
defmt-rtt = { version = "0.4", optional = true }
panic-probe = { version = "0.3", features = ["print-defmt"], optional = true }
libm = "0.2"

[profile.release]
debug = 2
